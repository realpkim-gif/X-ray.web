<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Radiant is a student-built AI-assisted X-ray research prototype that highlights areas of an image that may warrant additional review. Not a medical diagnostic device."
    />
    <meta name="theme-color" content="#f2650f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Radiant — AI-Assisted X-ray Review</title>
    <!--
      Pairs with public/404.html for GitHub Pages SPA routing: decodes the
      real path back out of the query string and restores it via
      history.replaceState before React Router reads the URL.
    -->
    <script>
      (function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) +
              decoded[0].slice(2) +
              (decoded[1] ? '?' + decoded[1].slice(2) : '') +
              l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
