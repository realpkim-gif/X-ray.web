<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Radiant</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or refresh
      of a route like /demo would 404. This encodes the intended path into
      the query string and redirects to index.html, which decodes it back
      before React Router mounts (see the inline script in index.html).
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1 // number of path segments to keep before the redirect marker (the "/radiant" base)
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?p=/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
