<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Radiant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
[data-intro] a{color:#F08A4B;text-decoration:none}
[data-intro] a:hover{color:#F3EDE6}
[data-intro][data-cur="1"],[data-intro][data-cur="1"] *{cursor:none !important}
[data-intro] button:focus-visible{outline:2px solid #E0641C;outline-offset:4px;border-radius:12px}
</style>
</helmet>
<div ref="{{ rootRef }}" data-intro="1" data-screen-label="Splash" style="position:fixed;inset:0;overflow:hidden;color:#F3EDE6;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;isolation:isolate">

<div data-i="back" style="position:absolute;inset:0;overflow:hidden;background:#161310;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat">
  <div data-i="glowA" style="position:absolute;left:0;top:0;width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;border-radius:50%;opacity:0;pointer-events:none;will-change:transform;background:radial-gradient(closest-side,rgba(224,100,28,.15),rgba(224,100,28,.05) 48%,rgba(224,100,28,0))"></div>
  <div data-i="glowB" style="position:absolute;left:0;top:0;width:80vmax;height:80vmax;margin:-40vmax 0 0 -40vmax;border-radius:50%;opacity:0;pointer-events:none;will-change:transform;background:radial-gradient(closest-side,rgba(240,138,75,.09),rgba(240,138,75,0))"></div>
  <div data-i="ghost" style="position:absolute;left:-4%;top:-4%;width:108%;height:108%;opacity:0;pointer-events:none;will-change:transform">
    <img data-sp="dog" alt="" draggable="false" src="https://commons.wikimedia.org/wiki/Special:FilePath/Side_view_x-ray_of_large_struvite_stone_in_bladder_of_adult_female_bichon_frise.jpg?width=1920" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25)">
    <img data-sp="cat" alt="" draggable="false" src="https://commons.wikimedia.org/wiki/Special:FilePath/Side_stand%C2%B4s_cat_radiography.jpg?width=1920" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25);clip-path:inset(0% 0% 100% 0%)">
  </div>
  <div data-i="litm" style="position:absolute;inset:0;pointer-events:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-image:linear-gradient(transparent,transparent);mask-image:linear-gradient(transparent,transparent)">
    <div data-i="lit" style="position:absolute;left:-4%;top:-4%;width:108%;height:108%;will-change:transform">
      <img data-sp="dog" alt="" draggable="false" src="https://commons.wikimedia.org/wiki/Special:FilePath/Side_view_x-ray_of_large_struvite_stone_in_bladder_of_adult_female_bichon_frise.jpg?width=1920" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.5) brightness(1.25)">
      <img data-sp="cat" alt="" draggable="false" src="https://commons.wikimedia.org/wiki/Special:FilePath/Side_stand%C2%B4s_cat_radiography.jpg?width=1920" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.5) brightness(1.25);clip-path:inset(0% 0% 100% 0%)">
    </div>
  </div>
  <canvas data-i="bg" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"></canvas>
  <div data-i="vig" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 78% 72% at 50% 46%,rgba(22,19,16,0) 42%,rgba(22,19,16,.42) 78%,rgba(22,19,16,.78) 100%)"></div>
  <div data-i="neg" style="position:absolute;inset:0;opacity:0;pointer-events:none;background:#FAF8F5;isolation:isolate">
    <div data-i="negi" style="position:absolute;left:-4%;top:-4%;width:108%;height:108%;mix-blend-mode:multiply">
      <img data-sp="dog" alt="" draggable="false" src="https://commons.wikimedia.org/wiki/Special:FilePath/Side_view_x-ray_of_large_struvite_stone_in_bladder_of_adult_female_bichon_frise.jpg?width=1920" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:invert(1) grayscale(1) sepia(.35) contrast(1.15)">
      <img data-sp="cat" alt="" draggable="false" src="https://commons.wikimedia.org/wiki/Special:FilePath/Side_stand%C2%B4s_cat_radiography.jpg?width=1920" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:invert(1) grayscale(1) sepia(.35) contrast(1.15);clip-path:inset(0% 0% 100% 0%)">
    </div>
  </div>
  <canvas data-i="fx" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"></canvas>
  <div data-i="grain" style="position:absolute;left:-128px;top:-128px;right:-128px;bottom:-128px;opacity:.055;pointer-events:none;will-change:transform"></div>
</div>

<div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none">
  <div data-i="center" style="display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,26px)">
    <div data-i="wbox" style="will-change:transform"><h1 data-i="word" aria-label="Radiant" style="position:relative;margin:0;font-size:clamp(72px,min(17.5vw,34vh),340px);line-height:1;letter-spacing:-0.05em;font-weight:700;white-space:nowrap">
      <span data-i="solid" aria-hidden="true" style="display:block;padding:.12em .09em .16em;color:#F3EDE6;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat"><span data-l="0" style="display:inline-block;font-weight:var(--w0,700);transform:var(--t0,none)"><span data-r="1" style="display:inline-block">R</span></span><span data-l="1" style="display:inline-block;font-weight:var(--w1,700);transform:var(--t1,none)"><span data-r="1" style="display:inline-block">a</span></span><span data-l="2" style="display:inline-block;font-weight:var(--w2,700);transform:var(--t2,none)"><span data-r="1" style="display:inline-block">d</span></span><span data-l="3" style="display:inline-block;font-weight:var(--w3,700);transform:var(--t3,none)"><span data-r="1" style="display:inline-block">i</span></span><span data-l="4" style="display:inline-block;font-weight:var(--w4,700);transform:var(--t4,none)"><span data-r="1" style="display:inline-block">a</span></span><span data-l="5" style="display:inline-block;font-weight:var(--w5,700);transform:var(--t5,none)"><span data-r="1" style="display:inline-block">n</span></span><span data-l="6" style="display:inline-block;font-weight:var(--w6,700);transform:var(--t6,none)"><span data-r="1" style="display:inline-block">t</span></span></span>
      <span data-i="line" aria-hidden="true" style="position:absolute;inset:0;display:block;padding:.12em .09em .16em;color:transparent;-webkit-text-stroke:max(1.5px,.006em) #F08A4B;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-image:linear-gradient(transparent,transparent);mask-image:linear-gradient(transparent,transparent)"><span data-l="0" style="display:inline-block;font-weight:var(--w0,700);transform:var(--t0,none)"><span data-r="1" style="display:inline-block">R</span></span><span data-l="1" style="display:inline-block;font-weight:var(--w1,700);transform:var(--t1,none)"><span data-r="1" style="display:inline-block">a</span></span><span data-l="2" style="display:inline-block;font-weight:var(--w2,700);transform:var(--t2,none)"><span data-r="1" style="display:inline-block">d</span></span><span data-l="3" style="display:inline-block;font-weight:var(--w3,700);transform:var(--t3,none)"><span data-r="1" style="display:inline-block">i</span></span><span data-l="4" style="display:inline-block;font-weight:var(--w4,700);transform:var(--t4,none)"><span data-r="1" style="display:inline-block">a</span></span><span data-l="5" style="display:inline-block;font-weight:var(--w5,700);transform:var(--t5,none)"><span data-r="1" style="display:inline-block">n</span></span><span data-l="6" style="display:inline-block;font-weight:var(--w6,700);transform:var(--t6,none)"><span data-r="1" style="display:inline-block">t</span></span></span>
    </h1></div>
    <button data-i="go" type="button" onClick="{{ go }}" style="pointer-events:auto;position:relative;display:flex;align-items:center;gap:14px;padding:12px 18px;border:none;background:none;color:#A89E93;font-family:inherit;font-size:clamp(14px,1.05vw,17px);font-weight:500;cursor:pointer">
      <sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}">
        <span>Press</span>
        <span data-i="key" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:128px;height:40px;border-radius:10px;border:1px solid rgba(243,237,230,.2);background:linear-gradient(180deg,rgba(243,237,230,.09),rgba(243,237,230,.02));box-shadow:inset 0 1px 0 rgba(243,237,230,.1),inset 0 -3px 0 rgba(0,0,0,.55),0 12px 26px -14px rgba(0,0,0,.95);color:#F3EDE6;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease,border-color .35s ease,color .35s ease">
          <span data-i="shine" style="position:absolute;top:0;bottom:0;left:0;width:44%;pointer-events:none;background:linear-gradient(90deg,rgba(240,138,75,0),rgba(240,138,75,.32),rgba(240,138,75,0));transform:translateX(-110%)"></span>
          <span style="position:relative">space</span>
        </span>
        <span>to continue</span>
      </sc-if>
      <sc-if value="{{ touch }}" hint-placeholder-val="{{ false }}">
        <span style="display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:12px;border:1px solid rgba(243,237,230,.22);background:rgba(243,237,230,.05);color:#F3EDE6">Tap to continue</span>
      </sc-if>
    </button>
  </div>
</div>

<div style="position:absolute;inset:0;pointer-events:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.02em;color:#8A8178">
  <div data-hud="tl" style="position:absolute;left:clamp(20px,2.4vw,40px);top:clamp(20px,3.2vh,36px);display:flex;align-items:center;gap:12px;opacity:0">
    <span style="width:26px;height:26px;border-radius:7px;background:#E0641C;display:grid;place-items:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><g transform="rotate(-45 12 12)"><rect x="7" y="10.2" width="10" height="3.6" rx="1"></rect><circle cx="7" cy="9.9" r="2.3"></circle><circle cx="7" cy="14.1" r="2.3"></circle><circle cx="17" cy="9.9" r="2.3"></circle><circle cx="17" cy="14.1" r="2.3"></circle></g></svg></span>
    <span data-i="tlText" style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:13.5px;letter-spacing:0;color:#B9AFA4">{{ hello }}</span>
  </div>
  <div data-hud="tr" style="position:absolute;right:clamp(20px,2.4vw,40px);top:clamp(20px,3.2vh,36px);display:flex;align-items:center;gap:10px;height:26px;opacity:0">
    <span data-i="led" style="width:7px;height:7px;border-radius:50%;background:#E0641C"></span>
    <span data-i="status" style="color:#CFC6BB">Detector ready</span>
  </div>
  <div data-hud="bl" style="position:absolute;left:clamp(20px,2.4vw,40px);bottom:clamp(20px,3.2vh,36px);display:flex;align-items:center;gap:14px;opacity:0">
    <div role="group" aria-label="Radiograph" style="pointer-events:auto;position:relative;display:flex;padding:3px;border-radius:10px;background:rgba(243,237,230,.04);border:1px solid rgba(243,237,230,.1)">
      <span style="position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:#E0641C;transform:translateX({{ segX }});transition:transform .55s cubic-bezier(.2,.7,.2,1)"></span>
      <button type="button" onClick="{{ setDog }}" aria-pressed="{{ isDog }}" style="position:relative;height:30px;min-width:76px;padding:0 12px;border:none;background:none;border-radius:7px;font-family:inherit;font-size:11.5px;letter-spacing:.02em;color:{{ dogC }};cursor:pointer;transition:color .35s ease">Canine</button>
      <button type="button" onClick="{{ setCat }}" aria-pressed="{{ isCat }}" style="position:relative;height:30px;min-width:76px;padding:0 12px;border:none;background:none;border-radius:7px;font-family:inherit;font-size:11.5px;letter-spacing:.02em;color:{{ catC }};cursor:pointer;transition:color .35s ease">Feline</button>
    </div>
    <span data-i="blText">Lateral view</span>
  </div>
  <div data-hud="br" data-i="br" style="position:absolute;right:clamp(20px,2.4vw,40px);bottom:clamp(20px,3.2vh,36px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;opacity:0">
    <span data-i="read" style="color:#CFC6BB;white-space:pre;font-variant-numeric:tabular-nums">X 0000   Y 0000   Ø 0000</span>
    <sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}"><span>Scroll to resize the beam · Click to expose</span></sc-if>
    <sc-if value="{{ touch }}" hint-placeholder-val="{{ false }}"><span>Drag to move the beam</span></sc-if>
  </div>
</div>

<div data-i="curRing" aria-hidden="true" style="position:absolute;left:0;top:0;opacity:0;pointer-events:none;will-change:transform;transition:opacity .3s ease">
  <div data-i="curIn" style="position:absolute;left:-15px;top:-15px;width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:1px solid rgba(243,237,230,.5);transition:transform .45s cubic-bezier(.2,.7,.2,1),border-color .3s ease"></div>
</div>
<div data-i="curDot" aria-hidden="true" style="position:absolute;left:0;top:0;opacity:0;pointer-events:none;will-change:transform;transition:opacity .3s ease">
  <div style="position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:#F3EDE6"></div>
</div>
<div data-i="flash" aria-hidden="true" style="position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,#FFFFFF 0%,#FFF7F0 34%,#FBE7D6 72%,#F5D6BD 100%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;beamTint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bone&quot;,&quot;amber&quot;],&quot;default&quot;:&quot;bone&quot;,&quot;tsType&quot;:&quot;'bone'|'amber'&quot;,&quot;section&quot;:&quot;Beam&quot;},&quot;ambience&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;calm&quot;,&quot;lively&quot;],&quot;default&quot;:&quot;calm&quot;,&quot;tsType&quot;:&quot;'calm'|'lively'&quot;,&quot;section&quot;:&quot;Ambient&quot;},&quot;customCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cursor&quot;},&quot;previewReducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Accessibility&quot;},&quot;reverse&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(base: number) =&gt; void&quot;},&quot;onDone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onReady&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onCovered&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const CH = 640, SWAP = CH + 120, AP0 = CH + 500, APD = 1000, MOR0 = AP0 - 40, MORD = 1000, END = AP0 + APD + 40;
const RAP = 950, RSW = RAP + 60, UC = 800, REND = RSW + UC;
const FLASH = [{ opacity: 0, easing: 'cubic-bezier(.5,0,1,1)' }, { opacity: 1, offset: 0.16 }, { opacity: 1, offset: 0.32, easing: 'cubic-bezier(.2,.6,.3,1)' }, { opacity: 0 }];
const HL = { dog: [56, 46, 22, 28], cat: [34, 40, 22, 26] };
const TINT = {
  bone: 'grayscale(1) contrast(1.5) brightness(1.25)',
  amber: 'grayscale(1) sepia(1) saturate(2.6) hue-rotate(-14deg) contrast(1.35) brightness(1.15)'
};
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const io3 = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const out3 = t => 1 - Math.pow(1 - t, 3);
const sio = t => (1 - Math.cos(Math.PI * t)) / 2;
const bez = (x1, y1, x2, y2) => x => {
  if (x <= 0) return 0; if (x >= 1) return 1;
  let t = x;
  for (let i = 0; i < 8; i++) {
    const u = 1 - t, fx = 3 * x1 * t * u * u + 3 * x2 * t * t * u + t * t * t - x, dx = 3 * x1 * u * u + 6 * (x2 - x1) * t * u + 3 * (1 - x2) * t * t;
    if (Math.abs(fx) < 1e-5 || Math.abs(dx) < 1e-6) break;
    t = clamp(t - fx / dx);
  }
  const w = 1 - t; return 3 * y1 * t * w * w + 3 * y2 * t * t * w + t * t * t;
};
const APE = bez(0.7, 0, 0.2, 1);
const pad = n => String(Math.max(0, Math.round(n))).padStart(4, '0');
const TAU = 6.2832;
const MK = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('mask-image', 'none') ? 'mask' : 'webkitMask';

const KEY = 'radiant-account';
const readAcct = () => { for (const s of ['localStorage', 'sessionStorage']) { try { const st = window[s], a = JSON.parse(st.getItem(KEY) || 'null'); if (a && (!a.exp || a.exp > Date.now())) return a; if (a) st.removeItem(KEY); } catch (e) {} } return null; };
class Component extends DCLogic {
  state = { species: 'dog', touch: false, hello: '' };
  rootRef = React.createRef();
  rm() { return !!this.props.previewReducedMotion || !!(this._mq && this._mq.matches); }

  componentDidMount() {
    const root = this.rootRef.current; if (!root) return;
    this.root = root;
    this.hosted = typeof this.props.onDone === 'function';
    const acct = readAcct();
    if (!this.hosted && !acct) { this.root = null; try { window.location.replace('Login.dc.html?next=Intro.dc.html'); } catch (e) {} return; }
    if (acct) { let fresh = false; try { fresh = !!sessionStorage.getItem('radiant-fresh'); sessionStorage.removeItem('radiant-fresh'); } catch (e) {} this.setState({ hello: (fresh ? 'Welcome, ' : 'Welcome back, ') + String(acct.given || acct.name || 'there').trim() }); }
    const hostEl = root.closest('[data-intro-host]'); if (hostEl) hostEl.style.background = 'transparent';
    if (!this.hosted) root.style.background = '#FAF8F5';
    const el = this.el = {}; root.querySelectorAll('[data-i]').forEach(n => { el[n.dataset.i] = n; });
    this.L = Array.from(el.solid.querySelectorAll('[data-l]'));
    this.gimg = { dog: el.ghost.querySelector('img[data-sp="dog"]'), cat: el.ghost.querySelector('img[data-sp="cat"]') };
    this._mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    this.touch = window.matchMedia('(hover: none)').matches;
    if (this.touch) this.setState({ touch: true });
    const w = window.innerWidth, h = window.innerHeight;
    this.P = { x: w / 2, y: h * 0.46, t: -1e9, on: false };
    this.B = { x: w / 2, y: h * 0.46, r: 0, v: 0 };
    this.C = { x: w / 2, y: h / 2 }; this.G = { x: w / 2, y: h / 2 }; this.par = { x: 0, y: 0 };
    this.xrx = 0; this.xry = 0; this.idle = 1; this.roi = 0; this.rings = []; this.sc = []; this.lw = [700, 700, 700, 700, 700, 700, 700];
    this.resize(); window.addEventListener('resize', this.resize);
    this._move = e => {
      const P = this.P; P.x = e.clientX; P.y = e.clientY; P.t = performance.now(); P.on = true;
      const t = e.target && e.target.closest ? e.target : null;
      this.overBtn = !!(t && t.closest('button')); this.overGo = !!(t && t.closest('[data-i="go"]'));
    };
    this._down = e => {
      this._move(e);
      if (this.el.curIn) this.el.curIn.style.transform = this.overBtn ? 'scale(1.55)' : 'scale(.7)';
      if (this._tx || this._rv || e.button > 0 || this.overBtn) return;
      this.rings.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (this.rings.length > 5) this.rings.shift();
    };
    this._up = () => { if (this.el.curIn) this.el.curIn.style.transform = this.overBtn ? 'scale(1.9)' : 'scale(1)'; };
    this._out = e => { if (!e.relatedTarget) this.P.on = false; };
    this._key = e => { if ((e.code === 'Space' || e.key === ' ') && !e.repeat) { e.preventDefault(); this.go(); } };
    this._wheel = e => { e.preventDefault(); if (!this._tx && !this._rv) this.R0u = clamp((this.R0u || this.R0) * Math.exp(-e.deltaY * 0.0012), 70, 380); };
    window.addEventListener('pointermove', this._move, { passive: true });
    window.addEventListener('pointerup', this._up);
    document.addEventListener('mouseout', this._out);
    window.addEventListener('keydown', this._key);
    root.addEventListener('pointerdown', this._down);
    root.addEventListener('wheel', this._wheel, { passive: false });
    this.applyTint(); this.applyCursor(); this.makeGrain(); if (this.props.reverse && this.hosted) this.reverseIn(); else this.intro();
    if (typeof this.props.onReady === 'function') this.props.onReady();
    this._raf = requestAnimationFrame(this.tick);
  }
  componentDidUpdate(pp) {
    if (!this.root) return;
    if (pp.beamTint !== this.props.beamTint) this.applyTint();
    if (pp.customCursor !== this.props.customCursor || pp.previewReducedMotion !== this.props.previewReducedMotion) this.applyCursor();
  }
  componentWillUnmount() {
